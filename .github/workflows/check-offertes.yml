name: Check offerte-mails

on:
  schedule:
    # Elke 20 minuten. GitHub Actions garandeert geen exacte timing
    # (kan een paar minuten uitlopen bij drukte), maar dat is voor dit
    # doel geen probleem.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install -r requirements.txt

      - name: Check offerte-mails en maak offertes aan in Scope
        env:
          SCOPE_SERVER: ${{ secrets.SCOPE_SERVER }}
          SCOPE_USER: ${{ secrets.SCOPE_USER }}
          SCOPE_PASSWORD: ${{ secrets.SCOPE_PASSWORD }}
          SCOPE_ORGANIZATION_CODE: ${{ secrets.SCOPE_ORGANIZATION_CODE }}
          SCOPE_LEGAL_ENTITY_CODE: ${{ secrets.SCOPE_LEGAL_ENTITY_CODE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python check_offertes.py
